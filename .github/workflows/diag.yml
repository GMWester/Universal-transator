# Temporary: inspects where ONNX Runtime binaries can be downloaded from.
name: Diagnose ONNX Runtime sources
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for n in onnxruntime-c onnxruntime-objc; do
            s=$(python3 -c "import hashlib;h=hashlib.md5(b'$n').hexdigest();print('/'.join(h[:3]))")
            echo "== $n"; curl -fsSL "https://cdn.cocoapods.org/Specs/$s/$n/1.28.0/$n.podspec.json"; echo
          done
          echo "== tags"; git ls-remote --tags https://github.com/microsoft/onnxruntime | grep -E "v1\.2[6-9]" | head
          echo "== releases"; curl -fsSL "https://api.github.com/repos/microsoft/onnxruntime/releases?per_page=5" | python3 -c "import json,sys;[print(r['tag_name'],[a['name'] for a in r['assets']][:40]) for r in json.load(sys.stdin)]"
