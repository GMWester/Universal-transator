# Temporary: inspects where ONNX Runtime binaries can be downloaded from.
name: Diagnose ONNX Runtime sources
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          sudo apt-get install -y dnsutils >/dev/null 2>&1
          echo "== dig"; dig +short download.onnxruntime.ai CNAME; dig +short download.onnxruntime.ai
          C=$(dig +short download.onnxruntime.ai CNAME | head -1 | sed 's/\.$//')
          while [ -n "$C" ]; do echo "cname: $C"; N=$(dig +short "$C" CNAME | head -1 | sed 's/\.$//'); [ -z "$N" ] && break; C2="$C"; C="$N"; done
          for h in $(dig +short download.onnxruntime.ai CNAME | sed 's/\.$//') ; do
            for f in pod-archive-onnxruntime-c-1.28.0.zip pod-archive-onnxruntime-objc-1.28.0.zip; do
              echo "== https://$h/$f"; curl -sS -o /dev/null -w "%{http_code} %{size_download}\n" "https://$h/$f"
            done
          done
          echo "== repo"; curl -sI https://github.com/microsoft/onnxruntime | head -5
