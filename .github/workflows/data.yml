# Builds the offline Wiktionary language packs from kaikki.org (Wiktextract)
# and uploads them to the "data-<edition>" releases, from which the apps download them.
# Run manually from the Actions tab (e.g. once a month to refresh).
name: Offline data packs

on:
  # Push a tag like data-v1 to (re)build all packs, or run manually.
  push:
    tags: ["data-v*"]
  workflow_dispatch:
    inputs:
      editions:
        description: "Wiktionary editions (meanings language), comma separated"
        default: "en,de,fr,es,ru,zh,ja,ko,pl,pt,nl,it,tr,el,cs,th,ku,ms,vi,id"
      version:
        description: "Data version label"
        default: "1"
      models_only:
        description: "Only mirror the translation models (skip dictionaries)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      editions: ${{ steps.m.outputs.editions }}
    steps:
      - id: m
        run: |
          E='${{ github.event.inputs.editions || 'en,de,fr,es,ru,zh,ja,ko,pl,pt,nl,it,tr,el,cs,th,ku,ms,vi,id' }}'
          echo "editions=$(echo "$E" | python3 -c 'import sys,json;print(json.dumps([e.strip() for e in sys.stdin.read().split(",") if e.strip()]))')" >> "$GITHUB_OUTPUT"

  models:
    # Mirrors the translation models from Hugging Face to releases "model-<id>",
    # so the apps download everything from this GitHub repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          cfg = json.load(open('assets/config/app_config.json'))
          for m in cfg['translationModels']:
              tag = f"model-{m['id']}"
              os.makedirs(tag, exist_ok=True)
              for role, rels in m['files'].items():
                  for rel in rels:
                      name = rel.split('/')[-1]
                      try:
                          urllib.request.urlretrieve(m['baseUrl'] + rel, f'{tag}/{name}')
                          print('got', tag, name, os.path.getsize(f'{tag}/{name}') // 2**20, 'MB')
                          break
                      except Exception as e:
                          print('missing', m['baseUrl'] + rel, e)
              if subprocess.run(['gh', 'release', 'view', tag]).returncode != 0:
                  subprocess.run(['gh', 'release', 'create', tag, '--prerelease', '--latest=false',
                                  '--title', f"Translation model: {m['name']}",
                                  '--notes', f"Mirror of {m['baseUrl']} ({m['license']}). Downloaded by the app."], check=True)
              files = [f'{tag}/{f}' for f in os.listdir(tag)]
              subprocess.run(['gh', 'release', 'upload', tag, '--clobber', *files], check=True)
              subprocess.run(['rm', '-rf', tag])
          PY

  build:
    needs: matrix
    if: ${{ github.event.inputs.models_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        edition: ${{ fromJson(needs.matrix.outputs.editions) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h
      - name: Build packs
        run: |
          ED=${{ matrix.edition }}
          if [ "$ED" = en ]; then URL=https://kaikki.org/dictionary/raw-wiktextract-data.jsonl.gz
          else URL=https://kaikki.org/${ED}wiktionary/raw-wiktextract-data.jsonl.gz; fi
          WORK=/mnt/work; sudo mkdir -p $WORK && sudo chown "$USER" $WORK || { WORK=$RUNNER_TEMP/work; mkdir -p $WORK; }
          curl -fL --retry 5 -o $WORK/raw.jsonl.gz "$URL"
          python3 tools/build_wiktionary.py --edition "$ED" --input $WORK/raw.jsonl.gz \
            --out packs --work $WORK --version "${{ github.event.inputs.version || github.ref_name }}"
          rm -f $WORK/raw.jsonl.gz
          ls -la packs | head -50
      - name: Upload to the "data-<edition>" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=data-${{ matrix.edition }}
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Offline data: ${{ matrix.edition }} Wiktionary" --latest=false --prerelease \
              --notes "Offline Wiktionary packs (CC BY-SA 4.0, from kaikki.org / Wiktextract), downloaded by the app. Not an app release."
          # replace the previous packs of this edition
          for a in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
            [ -f "packs/$a" ] || gh release delete-asset "$TAG" "$a" -y
          done
          gh release upload "$TAG" packs/* --clobber
